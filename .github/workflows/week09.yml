name: Lab 09 - Rust basics

on:
  push:
    paths:
      - 'week09/**'
      - '.github/workflows/week09.yml'
  pull_request:
    paths:
      - 'week09/**'
      - '.github/workflows/week09.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week09/lab09.md
          test -f week09/Cargo.toml
          test -d week09/src

  grade:
    if: github.repository != 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Run Lab 09 tests
        working-directory: week09
        run: cargo test --verbose
      - name: Check formatting
        working-directory: week09
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: week09
        run: cargo clippy -- -D warnings

