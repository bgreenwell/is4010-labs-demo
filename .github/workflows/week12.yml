name: Lab 12 - Generics and traits

on:
  push:
    paths:
      - 'week12/**'
      - '.github/workflows/week12.yml'
  pull_request:
    paths:
      - 'week12/**'
      - '.github/workflows/week12.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template:
    if: github.repository == 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Validate starter structure
        run: |
          test -f week12/lab12.md
          test -f week12/Cargo.toml
          test -d week12/src

  grade:
    if: github.repository != 'bgreenwell/is4010-labs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Run Lab 12 tests
        working-directory: week12
        run: cargo test --verbose
      - name: Check formatting
        working-directory: week12
        run: cargo fmt --check
      - name: Run Clippy
        working-directory: week12
        run: cargo clippy -- -D warnings

